<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"ARYAN YADAV (GHØST) From Mumbai Maharashtra"-Profile Centered Layout</title>
    <style>
        /* CSS Reset and Box Model Harmonization */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Root Layout Container using Dynamic Viewport Units */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #0d1117;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Fluid Typographic Display for Primary Heading */
        .primary-heading {
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 900;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #58a6ff;
            text-shadow: 0 0 25px rgba(88, 166, 255, 0.4),
                         0 0 50px rgba(88, 166, 255, 0.2);
            margin-bottom: 24px;
            text-align: center;
            line-height: 1.1;
        }

        /* Responsive Container Wrapper for Embedded Media */
        .media-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 340px;
        }

        /* Styled Profile Media Element */
        .profile-image {
            width: 100%;
            height: auto;
            max-height: 45dvh;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid #58a6ff;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7),
                        0 0 20px rgba(88, 166, 255, 0.25);
        }
    </style>
</head>
<body>

    <!-- Primary Centered Heading -->
    <h1 class="primary-heading">ARYAN</h1>

    <!-- Embedded Responsive Media Component -->
    <div class="media-wrapper">
        <img src=" <a href="https://ibb.co/9Hf0w35M"><img src="https://i.ibb.co/LdqyQh7G/aryan.jpg" alt="aryan" border="0"></a>" 
    </div>

</body>
</html>
